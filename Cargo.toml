[package]
name = "mysql-turboload"
version = "1.0.0"
edition = "2021"
description = "MySQL TurboLoad Enterprise: High-performance concurrent bulk data ingestion engine"

[[bin]]
name = "mysql-turboload"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rpassword = "7"
regex = "1.10"
colored = "2.1"
ctrlc = "3.4"
anyhow = "1.0"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
libc = "0.2"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

