[package]
name = "zephyr"
version = "1.0.0"
edition = "2021"
description = "Zephyr: High-performance concurrent MySQL bulk data engine"

[[bin]]
name = "zephyr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rayon = "1.10"
indicatif = { version = "0.18.6", features = ["rayon"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rpassword = "7"
regex = "1.10"
colored = "3.1.1"
ctrlc = "3.4"
anyhow = "1.0"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.6+spec-1.1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
libc = "0.2"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

